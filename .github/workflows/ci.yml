name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
            - run: bun install
            - run: bun run lint

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  lfs: true
            - uses: oven-sh/setup-bun@v2
            - run: bun install
            - run: bun run test
